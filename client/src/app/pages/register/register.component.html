<div class="register-page">

  <div class="register-card">

    <h1>PlaceX</h1>

    <p class="subtitle">
      Placement & Career Portal
    </p>

    <h2>Create Account</h2>

    <form (ngSubmit)="register()">

      <div class="form-group">

        <label>Name</label>

        <input
          type="text"
          name="name"
          [(ngModel)]="name"
          placeholder="Enter your name"
          required
        >

      </div>


      <div class="form-group">

        <label>Email</label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
          required
        >

      </div>


      <div class="form-group">

        <label>Password</label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          required
        >

      </div>


      <div class="form-group">

        <label>Role</label>

        <select
          name="role"
          [(ngModel)]="role"
        >

          <option value="student">
            Student
          </option>

          <option value="recruiter">
            Recruiter
          </option>

        </select>

      </div>


      <button
        type="submit"
        [disabled]="loading"
      >

        {{ loading ? 'Registering...' : 'Register' }}

      </button>


      <p
        class="success"
        *ngIf="successMessage"
      >
        {{ successMessage }}
      </p>


      <p
        class="error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </p>

    </form>


    <p class="login-link">

      Already have an account?

      <a routerLink="/login">
        Login
      </a>

    </p>

  </div>

</div>
