<div class="dashboard">

  <h1>
    Welcome, {{ user?.name }}
  </h1>

  <p>
    Find your next career opportunity with PlaceX.
  </p>

  <div class="dashboard-cards">

    <div class="card">

      <h2>Available Jobs</h2>

      <p>
        Explore current job opportunities.
      </p>

      <a routerLink="/jobs">
        Browse Jobs →
      </a>

    </div>

    <div class="card">

      <h2>Applications</h2>

      <p>
        Track your job applications.
      </p>

      <a routerLink="/applications">
        View Applications →
      </a>

    </div>

    <div class="card">

      <h2>Profile</h2>

      <p>
        View and update your profile.
      </p>

      <a routerLink="/profile">
        Update Profile →
      </a>

    </div>

  </div>

</div>
